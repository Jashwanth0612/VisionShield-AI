services:
  backend:
    build:
      context: ./backend
    container_name: visionshield-backend
    ports:
      - "8000:8000"
    environment:
      NAFNET_WEIGHTS_PATH: /app/models/nafnet/nafnet_weights.pth
      RTDETR_WEIGHTS_PATH: /app/models/rt_detr/rtdetr_weights.pt
      ARTIFACT_DIR: /app/data/artifacts
      DATABASE_PATH: /app/data/visionshield.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./models:/app/models:ro
      - visionshield-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: visionshield-frontend
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  visionshield-data:
