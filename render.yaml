services:
  - type: web
    name: visionshield-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Model checkpoints are fetched lazily from the public Google Drive store.
      # The backend keeps them off GitHub because the combined size is ~1.94 GB.
      - key: NAFNET_ITS_WEIGHTS_PATH
        value: ""
      - key: NAFNET_OTS_WEIGHTS_PATH
        value: ""
      - key: NAFNET_RAIN_WEIGHTS_PATH
        value: ""
      - key: NAFNET_SNOW_WEIGHTS_PATH
        value: ""
      - key: NAFNET_LOWLIGHT_WEIGHTS_PATH
        value: ""
      - key: RTDETR_WEIGHTS_PATH
        value: ""
      - key: CORS_ORIGINS
        fromService:
          name: visionshield-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ARTIFACT_DIR
        value: /tmp/visionshield-artifacts
      - key: DATABASE_PATH
        value: /tmp/visionshield.db

  - type: web
    name: visionshield-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: visionshield-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SITE_URL
        value: https://visionshield-frontend.onrender.com
