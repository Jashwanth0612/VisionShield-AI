services:
  - type: web
    name: visionshield-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NAFNET_ITS_WEIGHTS_PATH
        sync: false
      - key: NAFNET_OTS_WEIGHTS_PATH
        sync: false
      - key: NAFNET_RAIN_WEIGHTS_PATH
        sync: false
      - key: NAFNET_SNOW_WEIGHTS_PATH
        sync: false
      - key: NAFNET_LOWLIGHT_WEIGHTS_PATH
        sync: false
      - key: RTDETR_WEIGHTS_PATH
        sync: false
      - key: CORS_ORIGINS
        fromService:
          name: visionshield-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ARTIFACT_DIR
        value: /tmp/visionshield-artifacts
      - key: DATABASE_PATH
        value: /tmp/visionshield.db

  - type: web
    name: visionshield-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: visionshield-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
