services:
  - type: web
    name: visionshield-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NAFNET_ITS_WEIGHTS_PATH
        sync: false
      - key: NAFNET_OTS_WEIGHTS_PATH
        sync: false
      - key: NAFNET_RAIN_WEIGHTS_PATH
        sync: false
      - key: NAFNET_SNOW_WEIGHTS_PATH
        sync: false
      - key: NAFNET_LOWLIGHT_WEIGHTS_PATH
        sync: false
      - key: RTDETR_WEIGHTS_PATH
        sync: false
      - key: ARTIFACT_DIR
        value: /app/data/artifacts
      - key: DATABASE_PATH
        value: /app/data/visionshield.db
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: visionshield-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
